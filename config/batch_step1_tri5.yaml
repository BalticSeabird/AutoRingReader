# Example batch configuration for the step-based pipeline.

input:
  video_root_path: /mnt/BSP_NAS2_work/ring_reader/eventvids_imageio2
  cameras: [TRI5_SCALE]
  resume: true

models:
  ring_detector:
    model_name: 20230722002419_RingDataset1_yolov8n_640.pt
    model_root_path: ./models/
  tag_detector:
    model_name: 20230831155313_RingTagDataset1_yolov8n-seg_224.pt
    model_root_path: ./models/
  text_recognition:
    model_name: clip4str_base16x16_d70bde1f2d.ckpt
    model_root_path: ./CLIP4STR/models/

output_root_path: /mnt/BSP_NAS2_work/ring_reader/results

step1:
  n_processes_cpu: 16
  n_processes_gpu: 2
  gpu_devices: [0, 1]
  batch_size: 32
  frame_sample_rate: 1
  output_format: jpg
  save_crops: true
  crop_size: 224
  conf_threshold: 0.7
  iou_threshold: 0.7
  max_det: 1

step2:
  n_processes_cpu: 16
  n_processes_gpu: 2
  gpu_devices: [0, 1]
  batch_size: 16
  conf_threshold: 0.7
  iou_threshold: 0.7
  max_det: 2
  tag_height: 96
  output_format: jpg

step3:
  n_processes_cpu: 32
  n_processes_gpu: 1
  gpu_devices: [0]
  batch_size: 32
  conf_threshold: 0.90
  rotational_validation: true
  output_format: yaml
